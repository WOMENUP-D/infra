name: womanup
x-app: &app
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
  logging:
    driver: local
    options: {max-size: "10m", max-file: "3"}
services:
  migrate:
    <<: *app
    image: ${BACKEND_IMAGE:-ghcr.io/womenup-d/backend:unconfigured}
    restart: "no"
    profiles: [tools]
    env_file:
      - path: ${CONFIG_DIR:?}/backend.env
        format: raw
    command: [alembic, upgrade, head]
    healthcheck: {disable: true}
    networks: [database]
  backend:
    <<: *app
    image: ${BACKEND_IMAGE:-ghcr.io/womenup-d/backend:unconfigured}
    env_file:
      - path: ${CONFIG_DIR:?}/backend.env
        format: raw
    networks:
      edge:
        aliases: [womanup-api]
      database:
  worker:
    <<: *app
    image: ${BACKEND_IMAGE:-ghcr.io/womenup-d/backend:unconfigured}
    env_file:
      - path: ${CONFIG_DIR:?}/backend.env
        format: raw
    environment:
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
    command: [python, -m, app.worker]
    healthcheck:
      test: [CMD, python, -c, "import os,time; assert time.time()-os.stat('/tmp/worker-heartbeat').st_mtime < 1800"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    networks: [database, outbound]
  frontend:
    <<: *app
    image: ${FRONTEND_IMAGE:-ghcr.io/womenup-d/frontend:unconfigured}
    env_file:
      - path: ${CONFIG_DIR:?}/frontend.env
        format: raw
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,size=128m,uid=1000,gid=1000
    networks:
      edge:
        aliases: [womanup-web]
  caddy:
    image: caddy:2-alpine@sha256:881bbc60f9986d5ab8e7cfd6cf7e4ef3c9c0439fef2429d035d065577882f028
    restart: unless-stopped
    volumes:
      - ./platform/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
      ingress:
        aliases: [womanup-proxy]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
networks:
  edge:
  database:
    external: true
    name: ${DB_NETWORK:?}
  ingress:
    external: true
    name: ${INGRESS_NETWORK:?}
  outbound:
volumes:
  caddy_data:
  caddy_config:
